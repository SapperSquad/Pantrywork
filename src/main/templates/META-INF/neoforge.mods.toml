modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Compat targets. All optional: Pantrywork works with any subset installed —
# tag entries for absent mods are marked required=false and just get skipped.
[[dependencies.${mod_id}]]
    modId = "farmersdelight"
    type = "optional"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

