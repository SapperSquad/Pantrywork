plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pantrywork'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pantrywork'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pantrywork'
        }
    }

    mods {
        pantrywork {
            sourceSet sourceSets.main
        }
    }
}

// Reverse-bridge tag JSONs are emitted here by tools/GenerateBridges.ps1.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// `gradlew build -Prelease` strips dev-only content (test recipes,
// gametest classes) from the jar.
tasks.named('processResources', ProcessResources) {
    if (project.hasProperty('release')) {
        exclude 'data/pantrywork/recipe/test/**'
        exclude 'data/pantrywork/structure/**'   // gametest arena template
    }
}
tasks.named('jar', Jar) {
    if (project.hasProperty('release')) {
        exclude 'com/pantrywork/gametest/**'
    }
    // mod-list logo referenced by logoFile in neoforge.mods.toml
    from('promo/icon-512.png') { rename { 'icon.png' } }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Target mods are dev-run-only: FML discovers classpath mods in dev, so
    // runServer/runClient boot with them loaded and the compat tags can be
    // verified against the real items. Nothing here is a hard dependency —
    // every entry in neoforge.mods.toml is optional. Boot-matrix testing:
    // `gradlew runServer -PnoCompatMods` boots without any of them, which
    // must load cleanly (all cross-mod tag entries are required=false).
    if (!project.hasProperty('noCompatMods')) {
        runtimeOnly "maven.modrinth:farmers-delight:${project.farmers_delight_version}"
        // CurseForge-only mods, fetched manually to tools/work/jars (see
        // tools/work/jars/SOURCES.md). Croptopia requires EpheroLib.
        runtimeOnly files(
            'tools/work/jars/croptopia-neoforge-1.21.1-4.2.4.jar',
            'tools/work/jars/EpheroLib-1.21.1-NEO-FORGE-1.2.0.jar',
            'tools/work/jars/pamhc2foodcore-NEOFORGE-1.21.1-1.0.4.jar',
            'tools/work/jars/oceansdelight-neoforge-1.0.4-1.21.1.jar',
            'tools/work/jars/ends_delight-2.6.1+neoforge.1.21.1.jar',
            'tools/work/jars/origins-0.3.jar',
            'tools/work/jars/jupiter-2.3.7-1.21.1-neoforge.jar',
            // Let's Do series (all three need Architectury API; Farm & Charm
            // is added separately below so it can be dropped on its own)
            'tools/work/jars/letsdo-vinery-neoforge-1.5.3.jar',
            'tools/work/jars/letsdo-meadow-neoforge-1.4.8.jar',
            'tools/work/jars/architectury-13.0.11-neoforge.jar',
            // Brewin' & Chewin' (bundles GreenhouseConfig via jarjar) + Aquaculture 2
            'tools/work/jars/BrewinAndChewin-neoforge-4.5.0+1.21.1.jar',
            'tools/work/jars/Aquaculture-1.21.1-2.7.21.jar',
            // Create (bundles Ponder, Flywheel, Registrate via jarjar)
            'tools/work/jars/create-1.21.1-6.0.10.jar',
            // Bountiful Fares + its required lib NexusLib
            'tools/work/jars/bountifulfares-neoforge-1.21.1-3.0.12.jar',
            'tools/work/jars/nexuslib-neoforge-1.21.1-1.1.5.jar',
            // Fish of Thieves + its required lib Cloth Config
            'tools/work/jars/fish_of_thieves-mc1.21.1-v21.1.2.1-neoforge.jar',
            'tools/work/jars/cloth-config-15.0.140-neoforge.jar',
            // Refurbished Furniture + its required lib Framework
            'tools/work/jars/refurbished_furniture-neoforge-1.21.1-1.0.22.jar',
            'tools/work/jars/framework-neoforge-1.21.1-0.13.11.jar',
            // --- 0.8.0 Farmer's Delight addons (player report) ---
            // Kaleidoscope Cookery: no libs; neoforge + minecraft only (KubeJS
            // optional). Ships mixins, an access transformer and enumExtensions.
            'tools/work/jars/kaleidoscopecookery-1.6.0-neoforge+mc1.21.1.jar',
            // Hearth and Harvest: no libs; hard dep farmersdelight >= 1.3.0 only.
            'tools/work/jars/hearthandharvest-1.21.1-1.3.4.jar',
            // Cultural Delights + Cook's Collection (CD's HARD dep since 0.18.0,
            // and the owner of cookscollection:cooking_oil). Both need only FD.
            // HEADS UP: Cultural Delights 0.18.x declares neoforge "[21.1.247,)"
            // and gradle.properties pins neo_version=21.1.241, so this jar makes
            // runServer/runClient fail mod loading until that pin is raised to
            // 21.1.247+ (the SHIPPED jar is unaffected — neo_version_range stays
            // "[21.1.0,)"). Downgrading CD is not a fix: 0.17.8 has floor
            // "[21.1.0,)" but no Cook's dep and a different tag/item set.
            'tools/work/jars/culturaldelights-1.21.1-0.18.1.jar',
            'tools/work/jars/cookscollection-0.6.1.jar',
            // Rustic Delight: no libs on NeoForge; hard dep farmersdelight >= 1.3.1.
            'tools/work/jars/rusticdelight-neoforge-1.21-1.7.1.jar')
        // `gradlew runServer -PnoFarmAndCharm` drops ONLY Farm & Charm, to prove
        // bridges that would otherwise resolve through F&C's own tags (e.g.
        // croptopia:dough -> c:dough) stand on their own. Meadow and Vinery do
        // not require farm_and_charm (checked their mods.toml), so they stay.
        if (!project.hasProperty('noFarmAndCharm')) {
            runtimeOnly files('tools/work/jars/letsdo-farm_and_charm-neoforge-1.1.23.jar')
        }
        // `gradlew runServer -PnoHybridDelights` drops ONLY the Hybrid Delights
        // stack. It is on its own flag because it is the one compat target whose
        // dependencies are not plain javafml mods:
        //   hybrid_delights -> modLoader "kotlinforforge" + hapi >= 1.0.0
        //   hapi            -> modLoader "kotlinforforge" + geckolib >= 4.7.4
        //   kotlinforforge  -> FMLModType: LIBRARY, NO neoforge.mods.toml at all;
        //                      kfflang (the LANGPROVIDER), kfflib, kffmod and the
        //                      Kotlin stdlib are all nested in META-INF/jarjar/.
        // A language provider has to reach FML's plugin layer, which a dev-run
        // `runtimeOnly files(...)` classpath entry is not guaranteed to do, so if
        // the dev boot dies on "kotlinforforge" / a missing kfflang, run with
        // -PnoHybridDelights and keep going: Pantrywork bridges
        // hybrid_delights:salt by literal item id, so the bridge data needs no HD
        // jar at runtime, and HD defines no judged c: tag (only c:tools/knife), so
        // the generator and AuditRoles do not need it on the classpath either —
        // they scan tools/work/jars from disk.
        if (!project.hasProperty('noHybridDelights')) {
            runtimeOnly files(
                'tools/work/jars/hybrid_delights-neoforge-1.21.1-1.3.1.jar',
                'tools/work/jars/hapi-neoforge-1.21.1-1.1.3.jar',
                'tools/work/jars/kotlinforforge-5.12.0-all.jar')
        }
        // `gradlew runServer -PnoByg` drops ONLY the Oh The Biomes We've Gone stack
        // (0.8.0 blueberry pass). Same reasoning as -PnoHybridDelights, different
        // cause: BYG is a 20.5 MB WORLDGEN mod with mixins — by far the heaviest
        // thing on this classpath — and it drags in three more libs. If the dev boot
        // gets slow, runs out of memory, or dies anywhere inside TerraBlender /
        // CorgiLib / Oh The Trees You'll Grow, boot with -PnoByg and keep going:
        // Pantrywork bridges biomeswevegone:blueberries by literal item id, so the
        // DATA needs no BYG jar at runtime, and the generator and AuditRoles scan
        // tools/work/jars from disk, not the boot classpath. What IS lost on a
        // -PnoByg boot is live proof: every `biomeswevegone:` assertion in
        // tools/tagtest-kaleido.txt becomes unanswerable there.
        if (!project.hasProperty('noByg')) {
            runtimeOnly files(
                'tools/work/jars/Oh-The-Biomes-Weve-Gone-NeoForge-2.6.2.jar',
                'tools/work/jars/TerraBlender-neoforge-1.21.1-4.1.0.8.jar',
                'tools/work/jars/Corgilib-NeoForge-1.21.1-5.0.0.9.jar',
                'tools/work/jars/Oh-The-Trees-Youll-Grow-neoforge-1.21.1-5.3.4.jar')
        }
        // GeckoLib is a HARD dep of BOTH optional stacks (HAPI requires >= 4.7.4,
        // BYG requires >= 4.6), so it is declared outside either flag and dropped
        // only when both are off. Leaving it inside the Hybrid Delights block would
        // have meant `-PnoHybridDelights` alone silently broke the BYG stack.
        if (!project.hasProperty('noHybridDelights') || !project.hasProperty('noByg')) {
            runtimeOnly files('tools/work/jars/geckolib-neoforge-1.21.1-4.9.3.jar')
        }
    }
}

// Fabric build: the payload is pure data, so the Fabric jar is the same
// tag files wrapped in a fabric.mod.json — no classes (which also avoids
// the mojmap/intermediary mapping problem entirely). Dev-only content is
// always excluded here, independent of -Prelease.
// One data payload, one jar per verified Minecraft line. Separate jars (rather
// than a single open-ended range) keep each claim tied to what was actually
// booted and tested, and limit the blast radius if a future MC line ever moves
// the data layout. 26.x kept data/c/tags/item + data/<ns>/recipe, so the tag
// files are byte-identical between the two.
def fabricMetadata(String taskName, String mcRange, String outDir) {
    return tasks.register(taskName, ProcessResources) {
        var props = [
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_version: project.mod_version,
            mod_license: project.mod_license,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description,
            mc_range: mcRange,
        ]
        inputs.properties props
        expand props
        from 'src/fabric/templates'
        into "${layout.buildDirectory.get()}/generated/sources/$outDir"
    }
}

def fabricPayload(Jar jar) {
    jar.archiveBaseName = project.mod_id
    jar.from('src/main/resources') {
        include 'data/**'
        exclude 'data/pantrywork/recipe/test/**'
        exclude 'data/pantrywork/structure/**'
    }
    // pack.mcmeta + pantrywork_gate_*/ carry the cost-floor GATEs: pack overlays that
    // apply only while a rescuing mod is loaded. Without them in the jar every gated
    // entry is silently missing (never ungated - the base files only hold optional refs).
    jar.from('src/generated/resources') {
        include 'data/**'
        include 'pack.mcmeta'
        include 'pantrywork_gate_*/**'
    }
    jar.from('promo/icon-512.png') {
        into 'assets/pantrywork'
        rename { 'icon.png' }
    }
}

var fabricMeta121 = fabricMetadata('generateFabricMetadata', '>=1.21.1 <1.22', 'fabricMetadata')
var fabricMeta26 = fabricMetadata('generateFabricMetadata26', '>=26.1 <27', 'fabricMetadata26')

tasks.register('fabricJar', Jar) {
    group = 'build'
    description = 'Data-only Fabric jar for Minecraft 1.21.x.'
    archiveClassifier = 'fabric'
    from fabricMeta121
    fabricPayload(it)
}

tasks.register('fabricJar26', Jar) {
    group = 'build'
    description = 'Data-only Fabric jar for Minecraft 26.x.'
    archiveClassifier = 'fabric-mc26'
    from fabricMeta26
    fabricPayload(it)
}

// NeoForge 26.x build: same data-only pattern as the Fabric jars. lowcodefml
// (no classes — PantryworkTagKeys is 1.21.1-line only until it's worth porting
// to the 26.x renames), iconFile instead of logoFile, and its own MC/Neo
// ranges. Verified the same way as the Fabric jars: live server boots + RCON
// suites, never inference.
var neoMeta26 = tasks.register('generateNeoMetadata26', ProcessResources) {
    var props = [
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_version: project.mod_version,
        mod_license: project.mod_license,
        mod_authors: project.mod_authors,
        mod_description: project.mod_description,
        minecraft_version_range: '[26.1,27)',
        neo_version_range: '[26.1,)',
        loader_version_range: '[1,)',
    ]
    inputs.properties props
    expand props
    from 'src/neoforge26/templates'
    into "${layout.buildDirectory.get()}/generated/sources/neoMetadata26"
}

tasks.register('neoJar26', Jar) {
    group = 'build'
    description = 'Data-only NeoForge jar for Minecraft 26.x.'
    archiveClassifier = 'neoforge-mc26'
    from neoMeta26
    from('src/main/resources') {
        include 'data/**'
        exclude 'data/pantrywork/recipe/test/**'
        exclude 'data/pantrywork/structure/**'
    }
    from('src/generated/resources') {
        include 'data/**'
        include 'pack.mcmeta'             // cost-floor gate overlays (see fabricPayload)
        include 'pantrywork_gate_*/**'
    }
    // root-level icon.png, referenced by iconFile in the 26.x mods.toml
    from('promo/icon-512.png') { rename { 'icon.png' } }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version: project.neo_version,
        neo_version_range: project.neo_version_range,
        loader_version_range: project.loader_version_range,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_license: project.mod_license,
        mod_version: project.mod_version,
        mod_authors: project.mod_authors,
        mod_description: project.mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties + [project: project]

    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
